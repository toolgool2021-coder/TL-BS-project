name: TL BS smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke.mjs && node tests/online.mjs
      - name: Run arena scenarios in Chrome
        env:
          TLBS_CHROMIUM: google-chrome
        run: node tests/arena.mjs
