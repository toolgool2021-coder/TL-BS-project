<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TL BS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="fullscreen-toggle" type="button" aria-label="Полноэкранный режим" aria-pressed="false">⛶</button>

<div id="menu" class="screen active" style="display: flex;">
    <main class="lobby">
        <header class="topbar"><h1>TL <i>BS</i></h1><nav><button id="profile-open" class="btn">Профиль</button><button id="room-open" class="btn">Онлайн</button></nav></header>
        <section class="loadout" aria-label="Выбранный боец">
            <div id="char-preview" aria-hidden="true"><span id="crest"></span></div>
            <div class="fighter-info"><h2 id="active-name">Шелли</h2><p id="fighter-stats"></p>
            <button class="btn" onclick="changeScreen('brawlers')">Сменить бойца</button></div>
        </section>
        <section class="match-panel"><label class="mode-label">Режим матча<select id="mode">
            <option value="training">Тренировка</option><option value="skirmish">Бой с ботом</option>
            <option value="arms">Гонка вооружений</option><option value="duel">Дуэль · три бойца</option>
        </select></label><p id="mode-help"></p><p class="map-size-label">Размер карты: <b id="map-size">2400 × 1800</b></p>
        <label id="custom-limit" hidden>Устранений для победы <input type="number" id="kill-limit" value="5" min="1" max="50"></label>
        <div id="reserves" hidden><label>Второй боец<select id="reserve-two"></select></label><label>Третий боец<select id="reserve-three"></select></label></div>
        <button id="ai-toggle" class="btn" onclick="toggleAI()">Бот: выкл</button>
        <button class="play-btn btn" onclick="changeScreen('game')">В бой ▸</button></section>
    </main>
</div>
<div id="brawlers-screen" class="screen">
    <header class="roster-head"><h2>Бойцы</h2><input id="fighter-search" type="search" placeholder="Найти бойца" aria-label="Найти бойца"></header>
    <div class="scroll-container" id="list"></div><p id="search-empty" hidden>Нет бойцов с таким именем</p>
    <button class="btn confirm" onclick="changeScreen('menu')">Готово</button>
</div>

<div id="hud"><canvas id="minimap" width="156" height="114" aria-label="Мини-карта"></canvas>
    <button class="exit-btn" onclick="exitToMenu()">ВЫЙТИ</button>
    <div class="ult-container"><div id="ult-bar"></div></div>
    <ol id="race-leaders" hidden aria-label="Лидеры гонки"></ol>
    <section id="gem-panel" hidden aria-label="Захват кристаллов">
        <div class="gem-scores"><span>Мы <b id="gem-us">0</b></span><span>Соперники <b id="gem-them">0</b></span></div>
        <div id="gem-clock"></div><div id="gem-life"></div>
    </section>
    <div id="ammo-container" class="ammo-wrap"></div>

    <div class="pin-system">
        <div id="pin-menu" class="pin-menu">
            <div class="pin-option" onclick="sendPin('👎')">👎</div>
            <div class="pin-option" onclick="sendPin('💎')">💎</div>
            <div class="pin-option" onclick="sendPin('🤬')">🤬</div>
            <div class="pin-option" onclick="sendPin('🤡')">🤡</div>
            <div class="pin-option" onclick="sendPin('☠️')">☠️</div>
        </div>
        <div class="pin-btn" title="Пины (E), выбор 1–5" onclick="togglePinMenu()">💬</div>
    </div>
</div>

<dialog id="profile-dialog" style="max-width:85vw;border:0;border-radius:16px;padding:20px;color:white;background:#18243c"><h2>Профиль</h2><label>Ник <input id="nickname" maxlength="24" autocomplete="off"></label><p id="profile-status" role="status" style="overflow-wrap:anywhere"></p><button id="profile-save" class="btn">Сохранить</button><button id="profile-sync" class="btn">Синхронизировать</button><button id="profile-close" class="btn">Закрыть</button></dialog><dialog id="room-dialog" style="max-width:85vw;background:#18243c;color:white;border:0;border-radius:16px"><h2>Онлайн-лобби</h2><input id="room-code" maxlength="6" placeholder="Код комнаты"><button class="btn" id="room-create">Создать</button><button class="btn" id="room-join">Войти</button><p id="room-status" role="status"></p><div id="room-members"></div><button class="btn" id="room-ready">Готов</button><select id="shared-mode" aria-label="Режим комнаты"><option value="ball">Броулбол 3×3</option><option value="knockout">Нокаут 3×3</option></select><button class="btn" id="shared-play">Играть против участника</button><button class="btn" id="room-race">Гонка с ботами · общий топ</button><button class="btn" id="room-preview">Тест синхронизации</button><button class="btn" id="room-leave">Выйти</button></dialog><dialog id="guest-game"><strong id="guest-score"></strong><canvas id="guest-canvas"></canvas><p>Нажми на поле, чтобы идти. Потяни и отпусти для атаки или удара по мячу.</p><button class="btn" id="guest-leave">Выйти</button></dialog><canvas id="gameCanvas"></canvas>

<script src="js/audio.js"></script>
<script src="js/brawlers.js"></script>
<dialog id="result" oncancel="event.preventDefault()"><h2 id="result-text"></h2><p id="result-total"></p><button class="btn" onclick="this.closest('dialog').close();current=selectedFighter;initGame()">Реванш</button><button class="btn" onclick="this.closest('dialog').close();exitToMenu()">В меню</button></dialog>
<script src="js/roster.js"></script>
<script src="js/gems.js"></script>
<script src="js/pitch.js"></script>
<script src="js/objectives.js"></script>
<script src="js/match.js"></script>
<script src="js/aim.js"></script>
<script src="js/summons.js"></script>
<script src="js/hammer.js"></script>
<script src="js/waves.js"></script>
<script src="js/game.js"></script>
<script src="js/combat.js"></script>
<script src="js/controls.js"></script>
<script src="js/lobby.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
