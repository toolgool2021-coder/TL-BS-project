<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TL BS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="menu" class="screen active" style="display: flex;">
    <h1>TL BS 4.0</h1><button id="profile-open" class="btn">ПРОФИЛЬ</button>
    <h2 id="active-name">ШЕЛЛИ</h2>
    <div id="char-preview" style="width:100px; height:100px; border-radius:50%; border:5px solid white; background:#bc42f5;"></div>
    <button class="play-btn btn" onclick="changeScreen('game')">ИГРАТЬ</button>
    <button id="ai-toggle" class="btn ai-btn" onclick="toggleAI()">БОТ: ВЫКЛ</button>
    <button class="btn" style="margin-top:20px;" onclick="changeScreen('brawlers')">БОЙЦЫ</button>
</div>

<div id="brawlers-screen" class="screen">
    <h2>ВЫБЕРИ БОЙЦА</h2>
    <div class="scroll-container" id="list"></div>
    <button class="btn" style="margin-top: 20px;" onclick="changeScreen('menu')">ВЫБРАТЬ</button>
</div>

<div id="hud">
    <button class="exit-btn" onclick="exitToMenu()">ВЫЙТИ</button>
    <div class="ult-container"><div id="ult-bar"></div></div>
    <div id="ammo-container" class="ammo-wrap"></div>

    <div class="pin-system">
        <div id="pin-menu" class="pin-menu">
            <div class="pin-option" onclick="sendPin('👎')">👎</div>
            <div class="pin-option" onclick="sendPin('💎')">💎</div>
            <div class="pin-option" onclick="sendPin('🤬')">🤬</div>
            <div class="pin-option" onclick="sendPin('🤡')">🤡</div>
            <div class="pin-option" onclick="sendPin('☠️')">☠️</div>
        </div>
        <div class="pin-btn" onclick="togglePinMenu()">💬</div>
    </div>
</div>

<dialog id="profile-dialog" style="max-width:85vw;border:0;border-radius:16px;padding:20px;color:white;background:#18243c"><h2>Профиль</h2><label>Ник <input id="nickname" maxlength="24" autocomplete="off"></label><p id="profile-status" role="status" style="overflow-wrap:anywhere"></p><button id="profile-save" class="btn">Сохранить</button><button id="profile-sync" class="btn">Синхронизировать</button><button id="profile-close" class="btn">Закрыть</button></dialog><canvas id="gameCanvas"></canvas>

<script src="js/audio.js"></script>
<script src="js/brawlers.js"></script>
<script src="js/game.js"></script>
<script src="js/combat.js"></script>
<script src="js/controls.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
